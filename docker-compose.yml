services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        EXPO_PUBLIC_FIREBASE_API_KEY: ${EXPO_PUBLIC_FIREBASE_API_KEY:-}
        EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${EXPO_PUBLIC_FIREBASE_PROJECT_ID:-}
        EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        EXPO_PUBLIC_FIREBASE_APP_ID: ${EXPO_PUBLIC_FIREBASE_APP_ID:-}
        EXPO_PUBLIC_USE_FIREBASE_EMULATORS: ${EXPO_PUBLIC_USE_FIREBASE_EMULATORS:-false}
        EXPO_PUBLIC_FIREBASE_EMULATOR_HOST: ${EXPO_PUBLIC_FIREBASE_EMULATOR_HOST:-localhost}
        EXPO_PUBLIC_FIREBASE_AUTH_EMULATOR_PORT: ${EXPO_PUBLIC_FIREBASE_AUTH_EMULATOR_PORT:-9099}
        EXPO_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_PORT: ${EXPO_PUBLIC_FIREBASE_FIRESTORE_EMULATOR_PORT:-8085}
    ports:
      - "8080:80"
    restart: unless-stopped

  firebase-emulators:
    build:
      context: .
      dockerfile: Dockerfile.firebase
    ports:
      - "4000:4000"
      - "5001:5001"
      - "8085:8085"
      - "9099:9099"
    profiles:
      - local-emulators
    restart: unless-stopped
    volumes:
      - firebase-emulator-data:/app/.firebase-data

volumes:
  firebase-emulator-data:
